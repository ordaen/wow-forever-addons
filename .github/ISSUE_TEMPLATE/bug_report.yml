name: Bug report
description: Something broke or behaves oddly in one of the Ordaen addons.
labels: [bug]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Addon
      # Keep in sync with addons/ (one entry per addon).
      options:
        - OrdaenMinimap
        - OrdaenTooltips
        - OrdaenChat
        - OrdaenPanel
        - OrdaenCore
        - Not sure
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Error report
      description: >
        If you saw a Lua error: install BugSack (with BugGrabber), reproduce the problem, open BugSack
        and copy the error here. It contains the error and where it happened, nothing personal.
        Please mention your Ordaen addon versions (shown in the AddOns list).
      render: text
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you doing, what did you expect, what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: Other addons (optional)
      description: Especially other minimap, bag or UI replacement addons.
