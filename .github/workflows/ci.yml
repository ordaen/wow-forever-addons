name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PRs are squash-merged, so the PR title becomes the commit release-please reads.
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --no -- commitlint --verbose
      - name: Lint PR commits
        run: >
          npx --no -- commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  lua:
    name: Lint & test (Lua)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5" # the Lua version WoW runs
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck && luarocks install busted
      - name: Install lua-language-server (type checks against api/forever/luals)
        env:
          LUALS_VERSION: "3.19.2"
        run: |
          dir="$RUNNER_TEMP/lua-language-server"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" | tar -xz -C "$dir"
          echo "$dir/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/ordaen
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # build (generated TOCs/locales, load order checks), luacheck, forever-lint, lua-language-server,
      # busted on dist/
      - run: eval "$(luarocks path)" && ordaen check

  package:
    name: Package (dry run)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ordaen
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Package every addon (no upload)
        run: |
          for manifest in addons/*/addon.jsonc; do
            scripts/package.sh "$(basename "$(dirname "$manifest")")"
          done
          ls -l .release/*.zip
