name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PRs are squash-merged, so the PR title becomes the commit release-please reads.
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --no -- commitlint --verbose
      - name: Lint PR commits
        run: >
          npx --no -- commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  addons:
    name: Check & test (LunaType)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      # The three checkouts stand side by side, as on a developer's machine: the suite is lunatype's, and the
      # Ordaen Dev window (private, wow-dev-tools) is one of the addons it builds and runs.
      - uses: actions/checkout@v7
        with:
          path: wow-forever-addons
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ordaen
          repositories: lunatype,wow-dev-tools
      - uses: actions/checkout@v7
        with:
          repository: ordaen/lunatype
          token: ${{ steps.token.outputs.token }}
          path: lunatype
      - uses: actions/checkout@v7
        with:
          repository: ordaen/wow-dev-tools
          token: ${{ steps.token.outputs.token }}
          path: wow-dev-tools
          sparse-checkout: modules
      - run: ln -s "$GITHUB_WORKSPACE/wow-dev-tools/modules/OrdaenDev" wow-forever-addons/addons/OrdaenDev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      # Checks, formats, builds and runs every addon against its snapshots.
      - run: zig build test
        working-directory: lunatype
