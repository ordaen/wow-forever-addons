name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # gh release upload (release-please itself uses the App token)

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      # The ordaen org does not let GITHUB_TOKEN open PRs, and PRs opened with GITHUB_TOKEN would not
      # trigger CI anyway. So release-please acts as an org-owned GitHub App
      # (Contents + Pull requests: read/write), configured via:
      #   vars.RELEASE_APP_CLIENT_ID, secrets.RELEASE_APP_PRIVATE_KEY
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # Opens/updates one "release PR" with version bumps + changelogs; merging it creates the
      # tags (<Addon>-vX.Y.Z) and GitHub releases.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}

  package:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]' && needs.release-please.outputs.paths_released != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ordaen
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Resolve addon, version and tag
        run: |
          addon="$(basename "${{ matrix.path }}")"
          version="$(jq -r --arg p "${{ matrix.path }}" '.[$p]' .release-please-manifest.json)"
          echo "ADDON=$addon" >> "$GITHUB_ENV"
          echo "TAG=$addon-v$version" >> "$GITHUB_ENV"
      - name: Package (and upload to CurseForge/Wago if configured)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: scripts/package.sh "$ADDON" "$TAG"
      - name: Attach zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" .release/*.zip --clobber
