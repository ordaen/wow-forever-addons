name: Install ordaen
description: >
  Put the ordaen CLI (the private build tool, ordaen/wow-dev-tools) on PATH, at the version pinned in
  .ordaen-version. Downloads its Linux release with the org GitHub App, which needs read access to
  wow-dev-tools (Contents: read).
inputs:
  client-id:
    description: The org App's client id (vars.RELEASE_APP_CLIENT_ID)
    required: true
  private-key:
    description: The org App's private key (secrets.RELEASE_APP_PRIVATE_KEY)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@v3
      id: token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ordaen
        repositories: wow-dev-tools
    - name: Download ordaen
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: |
        version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.ordaen-version")"
        dir="$RUNNER_TEMP/ordaen-bin"
        mkdir -p "$dir"
        gh release download "ordaen-v$version" -R ordaen/wow-dev-tools -p ordaen-linux-x64 -D "$dir"
        mv "$dir/ordaen-linux-x64" "$dir/ordaen"
        chmod +x "$dir/ordaen"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/ordaen" --version
